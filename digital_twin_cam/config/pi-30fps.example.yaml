# Profile thử hai camera 30FPS. Giữ bitrate1Mbps để so với 15FPS.
# Không tự áp dụng lên publisher đang chạy; cần benchmark CPU/nguồn và browser.
signaling:
  url: ws://10.147.19.155/signaling
  kit_code: '123'
  publish_key_file: ~/.local/share/digital_twin_cam/publish.key
  max_peer_tracks: 4
  negotiation_timeout: 20
  retry_seconds: 3
capture:
  ffmpeg: ffmpeg
  startup_timeout: 15
  stale_seconds: 5
  retry_seconds: 3
# Cấu hình chung cho cả hai camera; bitrate tính riêng cho mỗi camera.
video:
  width: 640
  height: 480
  fps: 30
  bitrate: 1000000
  gop: 30
cameras:
- id: camera1
  index: 0
  device: /dev/video0
  enabled: true
- id: camera2
  index: 1
  device: /dev/video2
  enabled: true
