[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-twin-cam"
version = "0.1.0"
description = "Raspberry Pi USB camera hardware H.264 publisher"
requires-python = ">=3.11"
dependencies = ["aiohttp==3.14.4", "aiortc==1.15.0", "av==17.1.0", "PyYAML==6.0.3"]

[project.scripts]
dt-cam = "digital_twin_cam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
